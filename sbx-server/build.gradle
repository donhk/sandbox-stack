plugins {
    id 'java'
    id 'application'
}

group = 'dev.donhk'

application {
    mainClass = 'dev.donhk.boot.ServerMain'
}

dependencies {
    implementation project(":sbx-common")
    implementation project(":vbox-glue")
    implementation 'info.picocli:picocli:4.7.7'

    implementation 'io.javalin:javalin:7.1.0'
    testImplementation 'io.javalin:javalin-testtools:7.1.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.21.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.21.2'

    implementation 'com.zaxxer:HikariCP:7.0.2'
    implementation 'com.h2database:h2:2.4.240'
    implementation 'commons-io:commons-io:2.21.0'
}

// Configure built-in run task
run {
    jvmArgs = ['-Dvbox.home=/usr/lib/virtualbox']
}

tasks.register('runDev', JavaExec) {
    group = 'application'
    description = 'Run the server with extra dev arguments'

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(application.mainClass)

    jvmArgs = ['-Dvbox.home=/usr/lib/virtualbox']
    args = [
            '--db-reset=true',
            '--sql-seeds=true',
            '--cors-origins=http://localhost:3000,http://pop-os.tail9437a0.ts.net:3000'
    ]
}